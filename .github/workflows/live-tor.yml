name: Live Tor

# Builds a real Tor circuit (meek bootstrap, consensus, microdescriptors, 3-hop exit)
# and fetches https://api.rocketx.exchange/v1/configs through it. Catches breakage from
# changes on the live Tor network (e.g. directory format changes) as well as code regressions.
# "Live Tor direct" jobs run direct relay mode (TCP straight to a guard's ORPort, no meek bridge)
# on the JVM (ubuntu) and in the iOS simulator (macOS), asserting the circuit really went direct
# rather than falling back to meek.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-tor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-tor:
    name: Live Tor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile tests
        run: ./gradlew :echalote:jvmTestClasses --no-daemon
      - name: Live Tor test (one retry on failure)
        env:
          # Only the Tor check; the direct-TLS checks (ECHALOTE_LIVE_TLS) depend on badssl.com.
          ECHALOTE_LIVE_TOR: "1"
        run: |
          set -u
          test_filter='io.bluewallet.echalote.LiveTlsSmokeTest.live_tor_rocketx_fetchVerifies'
          results=library/build/test-results/jvmTest
          for attempt in 1 2; do
            echo "::group::Live Tor attempt $attempt"
            rm -rf "$results"
            rc=0
            # --rerun + --no-build-cache: never reuse a cached (possibly skipped) result.
            # Per-attempt timeout: a broken circuit build can hang rather than fail.
            timeout 360 ./gradlew :echalote:jvmTest --tests "$test_filter" --rerun --no-build-cache --no-daemon || rc=$?
            echo "::endgroup::"
            # The test returns early when the env flag is missing; require proof it really ran.
            if [ "$rc" -eq 0 ] && grep -rqs --include='*.xml' 'live tor api.rocketx.exchange -> status=' "$results"; then
              grep -rhos --include='*.xml' 'live tor api.rocketx.exchange -> status=[^<]*' "$results"
              exit 0
            fi
            if [ "$rc" -eq 0 ]; then
              echo "::error::Live Tor test reported success but did not execute (no output in $results)"
              exit 1
            fi
            echo "::warning::Live Tor attempt $attempt failed (exit $rc)"
          done
          exit 1
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tor-report
          path: |
            library/build/reports/tests/jvmTest
            library/build/test-results/jvmTest
          if-no-files-found: ignore

  live-direct-jvm:
    name: Live Tor direct
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile tests
        run: ./gradlew :echalote:jvmTestClasses --no-daemon
      - name: Live direct-mode test (one retry on failure)
        env:
          ECHALOTE_LIVE_DIRECT: "1"
        run: |
          set -u
          test_filter='io.bluewallet.echalote.LiveDirectTorTest'
          results=library/build/test-results/jvmTest
          marker='live direct tor api.rocketx.exchange -> route=DIRECT'
          for attempt in 1 2; do
            echo "::group::Live direct attempt $attempt"
            rm -rf "$results"
            rc=0
            timeout 360 ./gradlew :echalote:jvmTest --tests "$test_filter" --rerun --no-build-cache --no-daemon || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ] && grep -rqsF --include='*.xml' "$marker" "$results"; then
              grep -rhos --include='*.xml' 'live direct[-a-z]* tor api.rocketx.exchange -> [^<]*' "$results"
              exit 0
            fi
            if [ "$rc" -eq 0 ]; then
              echo "::error::Live direct test reported success but did not execute (no output in $results)"
              exit 1
            fi
            echo "::warning::Live direct attempt $attempt failed (exit $rc)"
          done
          exit 1
      - name: Timing lines
        if: always()
        run: python3 .github/scripts/timing-summary.py timing-jvm-direct.txt library/build/test-results/jvmTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-direct-jvm-report
          path: |
            timing-jvm-direct.txt
            library/build/reports/tests/jvmTest
            library/build/test-results/jvmTest
          if-no-files-found: ignore

  live-direct-ios:
    name: Live Tor direct (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
      - name: Build iOS simulator test binaries (debug and release)
        run: ./gradlew :echalote:linkDebugTestIosSimulatorArm64 :echalote:linkReleaseTestIosSimulatorArm64 --no-daemon
      - name: Boot an iPhone simulator
        # A booted device runs trustd, which SecTrust needs for HTTPS certificate checks.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if ".iOS-" in r), reverse=True):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')
          xcrun simctl bootstatus "$udid" -b
          echo "ECHALOTE_IOS_SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Live direct-mode test in the iOS simulator (one retry on failure)
        env:
          # library/build.gradle.kts forwards this to the simulator as SIMCTL_CHILD_ECHALOTE_LIVE_DIRECT.
          ECHALOTE_LIVE_DIRECT: "1"
          SIMCTL_CHILD_ECHALOTE_LIVE_DIRECT: "1"
        run: |
          set -u
          test_filter='io.bluewallet.echalote.LiveDirectTorTest'
          results=library/build/test-results/iosSimulatorArm64Test
          marker='live direct tor api.rocketx.exchange -> route=DIRECT'
          for attempt in 1 2; do
            echo "::group::Live direct (iOS) attempt $attempt"
            rm -rf "$results"
            rc=0
            # perl alarm: macOS has no coreutils timeout.
            # The runner's bash uses -e and pipefail; capture Gradle's own exit code instead.
            set +e
            perl -e 'alarm shift; exec @ARGV' 600 ./gradlew :echalote:iosSimulatorArm64Test --tests "$test_filter" --rerun --no-build-cache --no-daemon 2>&1 | tee gradle-live.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            # The test returns early when the env flag is missing; require proof it really ran
            # in direct mode (the marker is printed only after route=DIRECT was recorded).
            if [ "$rc" -eq 0 ] && { grep -rqsF --include='*.xml' "$marker" "$results" || grep -qF "$marker" gradle-live.log; }; then
              { grep -rhos --include='*.xml' 'live direct[-a-z]* tor api.rocketx.exchange -> [^<]*' "$results"; grep -hoE 'live direct[-a-z]* tor api.rocketx.exchange -> .*|stage=direct-[a-z]+ .*' gradle-live.log; } | sort -u
              exit 0
            fi
            if [ "$rc" -eq 0 ]; then
              echo "::error::Live direct test reported success but did not execute (no marker in $results or the Gradle log)"
              exit 1
            fi
            echo "::warning::Live direct (iOS) attempt $attempt failed (exit $rc)"
          done
          exit 1
      - name: Timing lines (debug build)
        if: always()
        run: python3 .github/scripts/timing-summary.py timing-ios-debug.txt gradle-live.log library/build/test-results/iosSimulatorArm64Test
      - name: Live direct-mode test, optimized (release) test binary
        # Informational: the same live test run from the release (optimized) executable, to compare
        # timings with the debug build that Gradle's test task uses. Does not gate the job.
        continue-on-error: true
        env:
          SIMCTL_CHILD_ECHALOTE_LIVE_DIRECT: "1"
        run: |
          set -u
          kexe="$PWD/library/build/bin/iosSimulatorArm64/releaseTest/test.kexe"
          set +e
          perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl spawn "$ECHALOTE_IOS_SIMULATOR" "$kexe" \
            --ktest_filter='io.bluewallet.echalote.LiveDirectTorTest.*' > release-live.log 2>&1
          rc=$?
          set -e
          python3 .github/scripts/timing-summary.py timing-ios-release.txt release-live.log
          tail -n 20 release-live.log
          grep -qF 'live direct tor api.rocketx.exchange -> route=DIRECT' release-live.log && [ "$rc" -eq 0 ]
      - name: Upload test report and timing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-direct-ios-report
          path: |
            gradle-live.log
            release-live.log
            timing-ios-*.txt
            library/build/reports/tests/iosSimulatorArm64Test
            library/build/test-results/iosSimulatorArm64Test
          if-no-files-found: ignore
